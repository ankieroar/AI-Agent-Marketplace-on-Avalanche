services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warranty
      POSTGRES_DB: warranty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["warranty_pg:/var/lib/postgresql/data"]
volumes:
  warranty_pg:

